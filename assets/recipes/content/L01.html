<!-- Structure: product-analysis-camp cover; portrait theme image, not a horizontal card. -->
<style>
.recipe-L01 .cover{position:relative;min-height:1840px;padding:80px 112px 112px;isolation:isolate}
.recipe-L01 .eyebrow{color:var(--gold);font:500 40px/1.3 "Noto Sans SC",sans-serif}
.recipe-L01 .copy{position:relative;margin-top:80px;z-index:2;width:856px}
.recipe-L01 h1{width:856px;font:700 116px/1.16 "Noto Serif SC",serif;letter-spacing:-3px}
.recipe-L01 .sub{width:856px;margin-top:36px;color:var(--muted);font:400 40px/1.5 "Noto Sans SC",sans-serif}
.recipe-L01 .surface{position:relative;margin:64px -112px -112px;width:1080px;height:1120px;z-index:1}
.recipe-L01 .visual{width:100%;height:100%;background:url("{{hero_portrait_scene}}") center/cover no-repeat;mask-image:linear-gradient(to bottom,transparent,#000 16%,#000 78%,transparent);filter:saturate(.65) brightness(.85)}
</style>
<div class="recipe recipe-L01">
  <section class="cover" data-reading-zone="L01" data-contract="L01" data-hero-cover>
    <p class="eyebrow">活动或项目语境</p>
    <div class="copy" data-hero-copy>
      <h1 data-layout-role="title" data-fullwidth-text-axis="L01-copy" data-protected-text>让<span data-gold-keyword="hero-title">核心主张</span>成为第一阅读落点</h1>
      <p class="sub" data-layout-role="body" data-fullwidth-text-axis="L01-copy">补充新的信息，不复述眉题和主标题。</p>
    </div>
    <div class="surface" data-hero-surface><div class="visual" data-hero="imagegen" aria-label="当前文案对应的竖向暗场景"></div></div>
  </section>
</div>
